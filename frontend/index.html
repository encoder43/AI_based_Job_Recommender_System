<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Job Recommender</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <div class="container my-5">
        <header class="text-center mb-5">
            <h1 class="display-4">📄 AI Job Recommender</h1>
            <p class="lead">Upload your resume to get an AI-powered analysis and tailored job recommendations.</p>
        </header>

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <form id="upload-form">
                    <div class="mb-3">
                        <label for="resume-file" class="form-label fw-bold">Upload your Resume (PDF only)</label>
                        <input class="form-control" type="file" id="resume-file" accept=".pdf" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Analyze My Resume</button>
                </form>
            </div>
        </div>
        
        <div id="loading-spinner" class="text-center my-4" style="display: none;">
            <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div>
            <p class="mt-2">Analyzing your resume... This may take a moment.</p>
        </div>
        <div id="error-alert" class="alert alert-danger mt-3" style="display: none;" role="alert"></div>

        <div id="results-section" class="d-none">
            <div class="card mb-4 shadow-sm">
                <div class="card-header"><h3 class="mb-0">📑 Resume Analysis</h3></div>
                <div class="card-body">
                    <div class="accordion" id="analysisAccordion">
                        <div class="accordion-item">
                            <h2 class="accordion-header"><button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne"><strong>Resume Summary</strong></button></h2>
                            <div id="collapseOne" class="accordion-collapse collapse show" data-bs-parent="#analysisAccordion"><div class="accordion-body" id="summary-output"></div></div>
                        </div>
                        <div class="accordion-item">
                            <h2 class="accordion-header"><button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseTwo"><strong>🛠️ Skill Gaps & Missing Areas</strong></button></h2>
                            <div id="collapseTwo" class="accordion-collapse collapse" data-bs-parent="#analysisAccordion"><div class="accordion-body" id="gaps-output"></div></div>
                        </div>
                        <div class="accordion-item">
                            <h2 class="accordion-header"><button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseThree"><strong>🚀 Future Roadmap & Preparation Strategy</strong></button></h2>
                            <div id="collapseThree" class="accordion-collapse collapse" data-bs-parent="#analysisAccordion"><div class="accordion-body" id="roadmap-output"></div></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="text-center my-4">
                <button id="get-jobs-btn" class="btn btn-success btn-lg">🔎 Find Job Recommendations</button>
            </div>
            <div id="jobs-loading-spinner" class="text-center my-4" style="display: none;">
                <div class="spinner-border text-success" role="status"><span class="visually-hidden">Loading...</span></div>
                <p class="mt-2">Fetching the latest job openings for you...</p>
            </div>

            <div id="jobs-results" class="row d-none g-4">
                <div class="col-md-6">
                    <h3><i class="bi bi-person-workspace"></i> Indeed Jobs</h3>
                    <div id="indeed-jobs" class="job-list"></div>
                </div>
                <div class="col-md-6">
                    <h3><i class="bi bi-google"></i> Google Jobs</h3>
                    <div id="google-jobs" class="job-list"></div>
                </div>
                <div class="col-md-6">
                    <h3><i class="bi bi-door-open-fill"></i> Glassdoor Jobs</h3>
                    <div id="glassdoor-jobs" class="job-list"></div>
                </div>
                <div class="col-md-6">
                    <h3><i class="bi bi-briefcase-fill"></i> Naukri Jobs</h3>
                    <div id="naukri-jobs" class="job-list"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
